name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Deliberately without requirements-sam.txt: the tests exercise the classic-CV path
      # so CI never pulls ~1 GB of torch or any model weights.
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/ -q
      - name: app imports and routes resolve
        run: |
          python -c "
          import app
          paths = {r.path for r in app.app.routes}
          for p in ('/api/upload','/api/detect','/api/objects','/api/export'):
              assert p in paths, p
          print('routes ok:', len(paths))
          "

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build:core
      - run: npm run typecheck
      - run: npm run build
