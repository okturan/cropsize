<title>cropsize — crop scans onto real-size pages</title>

     Cloudflare Pages rejects any file over 25 MiB. Pinned with Subresource Integrity. -->

  integrity="sha384-uEaiZh7//Wy463wyKt2IRGCp/U7xzZL3k9Qd5Nm760KK9EkwN2nPN2DSEELB6WgC"
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
></script>
</head>
<body>
  <main id="app">
    <noscript>cropsize runs entirely in your browser and needs JavaScript.</noscript>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
